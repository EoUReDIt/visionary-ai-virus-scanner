name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go.mod is tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...
      - run: go vet -tags lite ./... && GOOS=windows go vet -tags lite ./...
      - run: go test -tags lite ./...
      - run: go vet -tags safe ./... && GOOS=windows go vet -tags safe ./...
      - run: go test -tags safe ./...
      - name: Embedded SQLite cache (sqlite tag)
        run: go vet -tags sqlite ./... && GOOS=windows go vet -tags sqlite ./... && go test -tags sqlite ./internal/cache/ ./internal/reputation/ ./internal/risk/
      - name: Engine allocation benchmarks
        run: go test -run=^$ -bench=BenchmarkScanFile -benchtime=5x -benchmem ./internal/engine
      - name: Lite idle budget (guard memory and CPU)
        run: |
          go build -tags lite -o visionary-lite ./cmd/visionary
          sh scripts/idle-budget.sh ./visionary-lite 40 3
      - name: Hot-file guard budget (busy 20 MB file)
        run: |
          go build -o visionary-core ./cmd/visionary
          sh scripts/guard-budget.sh ./visionary-lite 2 20
          sh scripts/guard-budget.sh ./visionary-core 5 20

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=0.2.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build all editions (Core, Lite, Safe)
        shell: pwsh
        run: .\scripts\build.ps1 -Version "${{ steps.v.outputs.version }}"
      - name: Smoke test (Core)
        shell: pwsh
        run: |
          $env:VISIONARY_HOME = "$env:RUNNER_TEMP\vhome-core"
          .\dist\visionary.exe version
          .\dist\visionary.exe status
          .\dist\visionary.exe risk guidance --json | Out-Null
          .\dist\visionary.exe reputation provider | Out-Null
          .\dist\visionary.exe scan .\scripts .\dist --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "core scan of the build output reported detections" }
      - name: Smoke test (Lite)
        shell: pwsh
        run: |
          $env:VISIONARY_HOME = "$env:RUNNER_TEMP\vhome-lite"
          .\dist\visionary-lite.exe version
          .\dist\visionary-lite.exe status
          .\dist\visionary-lite.exe risk guidance --json | Out-Null
          .\dist\visionary-lite.exe reputation provider | Out-Null
          .\dist\visionary-lite.exe scan .\scripts --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "lite scan reported detections" }
      - name: Smoke test (Safe)
        shell: pwsh
        run: |
          $env:VISIONARY_HOME = "$env:RUNNER_TEMP\vhome-safe"
          .\dist\visionary-safe.exe version
          .\dist\visionary-safe.exe status
          .\dist\visionary-safe.exe risk guidance --json | Out-Null
          .\dist\visionary-safe.exe reputation provider | Out-Null
          .\dist\visionary-safe.exe scan .\scripts --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "safe scan reported detections" }
      - name: Lite idle budget (Windows working set)
        shell: pwsh
        run: |
          $env:VISIONARY_HOME = "$env:RUNNER_TEMP\vhome-idle"
          $p = Start-Process .\dist\visionary-lite.exe -ArgumentList "guard" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 15
          $p.Refresh()
          $mb = [math]::Round($p.WorkingSet64 / 1MB, 1)
          Write-Host "lite guard idle working set: $mb MB, cpu seconds: $($p.TotalProcessorTime.TotalSeconds)"
          Stop-Process $p -Force
          if ($mb -gt 100) { throw "idle working set $mb MB exceeds the 100 MB budget" }
      - name: Signing pipeline self-test (throwaway certificate)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Visionary CI self-test" -CertStoreLocation Cert:\CurrentUser\My
          $pw = ConvertTo-SecureString "ci-selftest" -AsPlainText -Force
          $pfx = Join-Path $env:RUNNER_TEMP "selftest.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
          $env:CODESIGN_PFX_BASE64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfx))
          $env:CODESIGN_PFX_PASSWORD = "ci-selftest"
          $copy = Join-Path $env:RUNNER_TEMP "signed-copy.exe"
          Copy-Item dist\visionary-safe.exe $copy
          .\scripts\sign.ps1 $copy
          if (-not (Get-AuthenticodeSignature $copy).SignerCertificate) { throw "self-test signature missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: visionary-windows-${{ steps.v.outputs.version }}
          path: |
            dist/visionary.exe
            dist/VisionaryUI.exe
            dist/visionary-lite.exe
            dist/VisionaryUI-Lite.exe
            dist/visionary-safe.exe
            dist/VisionaryUI-Safe.exe
            dist/Visionary-*-Setup-*.exe
            dist/visionary-*-windows-amd64.zip
            dist/SHA256SUMS.txt
