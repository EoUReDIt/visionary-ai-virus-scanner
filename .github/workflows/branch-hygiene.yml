name: branch-hygiene

# Shows which branches are finished and safe to delete. Read-only: it never
# deletes a branch. Results appear in the run summary and in one tracking issue
# titled "Branch hygiene report" that is updated in place.
on:
  schedule:
    - cron: "17 6 * * 1"        # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    types: [closed]             # a merged PR usually frees its branch
  push:
    paths:
      - "scripts/branch_hygiene.py"
      - "scripts/test_branch_hygiene.py"
      - ".github/workflows/branch-hygiene.yml"

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: branch-hygiene
  cancel-in-progress: true

jobs:
  report:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s scripts -p "test_branch_hygiene.py"
      - name: Build report
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/branch_hygiene.py > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update tracking issue
        continue-on-error: true   # read-only tokens (forks) cannot write issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --limit 100 --json number,title \
                --jq '[.[] | select(.title == "Branch hygiene report")][0].number // empty')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file report.md
          else
            gh issue create --title "Branch hygiene report" --body-file report.md
          fi
