name: Release

# Publishes the Windows installers to a GitHub Release (a permanent download page;
# open to anyone if the repo is public, to people with access if it's private).
# Runs when you push a version tag like v0.2.0, or from the Actions tab with "Run workflow".
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish, e.g. v0.2.0 (the workflow builds the commit you run it on)'
        required: true

# Lets the built-in GITHUB_TOKEN create releases. No secrets to set up.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish installers
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag looks like a version
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag $env:TAG must look like v1.2.3 or v1.2.3-rc1" }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # build.ps1 runs vet and the tests, then builds both editions and their installers.
      # It signs only if CODESIGN_* secrets exist; without them the installers are unsigned.
      - name: Build
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: .\scripts\build.ps1 -Version $env:TAG.Substring(1)
      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist\Visionary*Setup-*.exe | ForEach-Object FullName)
          if ($files.Count -eq 0) { throw "no installers were built" }
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG exists; replacing its installers."
            gh release upload $env:TAG @files --clobber
          } else {
            $global:LASTEXITCODE = 0
            gh release create $env:TAG @files --title $env:TAG --generate-notes --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
